<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skyward — low-poly arcade flight</title>
<style>
/* Skyward UI — HUD + menu overlay styles (inlined by build.mjs) */
:root {
  --ink: #eef4fb;
  --dim: rgba(238, 244, 251, 0.62);
  --panel: rgba(10, 18, 30, 0.55);
  --line: rgba(255, 255, 255, 0.14);
  --accent: #ffc23d;
  --danger: #ff5a4e;
  --ok: #39d98a;
}

html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }

#skyward-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#skyward-ui { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); }

/* ---------- HUD ---------- */
.sw-hud { position: absolute; inset: 0; pointer-events: none; }

.sw-data {
  position: absolute; top: 18px; left: 18px; min-width: 190px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; backdrop-filter: blur(6px);
}
.sw-row { display: flex; justify-content: space-between; gap: 18px; font-size: 15px; line-height: 1.7; }
.sw-label { color: var(--dim); letter-spacing: 0.12em; font-size: 12px; padding-top: 2px; }
.sw-value { font-variant-numeric: tabular-nums; font-weight: 600; }

.sw-status { position: absolute; top: 18px; right: 18px; text-align: right; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; backdrop-filter: blur(6px); }
.sw-mode { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; font-size: 13px; margin-bottom: 4px; }
.sw-score { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sw-time { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }

.sw-hints { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); padding: 7px 16px; border-radius: 999px; white-space: nowrap; }

.sw-banner {
  position: absolute; top: 24%; left: 50%; transform: translate(-50%, -8px);
  font-size: 30px; font-weight: 800; letter-spacing: 0.06em; text-align: center;
  background: var(--panel); border: 1px solid var(--line); padding: 14px 34px; border-radius: 14px;
  opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
}
.sw-banner.show { opacity: 1; transform: translate(-50%, 0); }

/* stall warning */
.sw-hud.stalled .sw-data { border-color: var(--danger); box-shadow: 0 0 24px rgba(255, 90, 78, 0.35); animation: sw-pulse 0.6s infinite alternate; }
@keyframes sw-pulse { from { opacity: 1; } to { opacity: 0.55; } }

/* ---------- menu ---------- */
.sw-menu {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: radial-gradient(ellipse at center, rgba(8, 14, 26, 0.35) 0%, rgba(8, 14, 26, 0.78) 100%);
  pointer-events: auto; text-align: center; padding: 24px;
}
.sw-menu h1 { margin: 0; font-size: clamp(52px, 9vw, 96px); letter-spacing: 0.18em; font-weight: 900; color: var(--ink); text-shadow: 0 6px 40px rgba(0,0,0,0.5); }
.sw-menu .sub { margin: -6px 0 12px; color: var(--dim); font-size: 15px; letter-spacing: 0.04em; }
.sw-menu button {
  pointer-events: auto; cursor: pointer; width: min(320px, 80vw); padding: 14px 0; margin-top: 6px;
  font-size: 17px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink);
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 12px; transition: all 0.15s ease;
}
.sw-menu button:hover { background: rgba(255, 194, 61, 0.18); border-color: var(--accent); transform: translateY(-1px); }
.sw-menu .best { color: var(--dim); font-size: 13px; margin-top: 10px; }

</style>

<body>
<canvas id="skyward-canvas"></canvas>
<div id="skyward-ui"></div>
<script type="module">
import * as THREE from 'three'


/* ===== core/vec3.js (M_vec3) ===== */
const M_vec3 = (() => {

// core/vec3.js — pure vector math on plain {x,y,z} objects. No mutation of inputs.

function add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function scale(v, s) { return { x: v.x * s, y: v.y * s, z: v.z * s }; }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function cross(a, b) {
  return {
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x,
  };
}
function length(v) { return Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z); }
function normalize(v) {
  const l = length(v);
  if (l < 1e-9) return { x: 0, y: 0, z: 0 };
  return scale(v, 1 / l);
}
function lerp(a, b, t) {
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    z: a.z + (b.z - a.z) * t,
  };
}
function clone(v) { return { x: v.x, y: v.y, z: v.z }; }

return {add, sub, scale, dot, cross, length, normalize, lerp, clone};
})();

/* ===== core/input.js (M_input) ===== */
const M_input = (() => {

// core/input.js — input state machine. Mockable: consumes key-event arrays, never touches DOM.
// Events: { type: 'down' | 'up', code: string } using KeyboardEvent.code values.

const PITCH_UP = ['KeyW', 'ArrowUp'];
const PITCH_DOWN = ['KeyS', 'ArrowDown'];
const ROLL_LEFT = ['KeyA', 'ArrowLeft'];
const ROLL_RIGHT = ['KeyD', 'ArrowRight'];
const YAW_LEFT = ['KeyQ'];
const YAW_RIGHT = ['KeyE'];
const THROTTLE_UP = ['ShiftLeft', 'ShiftRight'];
const THROTTLE_DOWN = ['ControlLeft', 'ControlRight'];

function anyHeld(held, codes) {
  return codes.some((c) => held.has(c));
}

function createInput() {
  const held = new Set();
  let throttleDelta = 0; // rate of change per second, set from currently-held throttle keys

  function update(events) {
    for (const ev of events || []) {
      if (!ev || !ev.code) continue;
      if (ev.type === 'down') held.add(ev.code);
      else if (ev.type === 'up') held.delete(ev.code);
    }
    throttleDelta = 0;
    if (anyHeld(held, THROTTLE_UP)) throttleDelta += 1;
    if (anyHeld(held, THROTTLE_DOWN)) throttleDelta -= 1;
  }

  function snapshot() {
    let pitch = 0, roll = 0, yaw = 0;
    if (anyHeld(held, PITCH_UP)) pitch += 1;
    if (anyHeld(held, PITCH_DOWN)) pitch -= 1;
    if (anyHeld(held, ROLL_LEFT)) roll += 1;   // positive roll = left bank
    if (anyHeld(held, ROLL_RIGHT)) roll -= 1;
    if (anyHeld(held, YAW_LEFT)) yaw += 1;
    if (anyHeld(held, YAW_RIGHT)) yaw -= 1;
    return { throttleDelta, pitch, roll, yaw };
  }

  function reset() { held.clear(); throttleDelta = 0; }

  return { update, snapshot, reset };
}

return {createInput};
})();

/* ===== core/flightModel.js (M_flightModel) ===== */
const M_flightModel = (() => {
const {add, scale, clone} = M_vec3;
// core/flightModel.js — pure aircraft physics step function.
// Same state + input + dt always produces the same output (deterministic).
//
// Model: arcade with light realism. Velocity is always aligned to the nose
// direction (no sideslip), so "lift" is implicit — the jet flies where it points.
// Airspeed (a scalar) is driven by thrust minus quadratic drag, plus/minus gravity
// along the flight path: climbing bleeds airspeed, diving gains it. That single rule
// makes stalling and stall-recovery converge cleanly (dive + throttle to regain speed).


const FLIGHT_CONST = Object.freeze({
  MAX_THROTTLE_RATE: 0.5,      // throttle units per second
  THRUST_ACCEL: 42,            // m/s^2 at full throttle
  DRAG_COEFF: 0.0028,          // quadratic drag (m/s^-1); tuned so spawn speed is near equilibrium at default throttle
  GRAVITY: 9.8,                // m/s^2; acts along the flight path via forward.y
  STALL_SPEED: 55,             // m/s — below this, lift insufficient -> stall
  STALL_RECOVERY_SPEED: 70,    // hysteresis: recover above this
  PITCH_RATE: 1.1,             // rad/s at full stick
  ROLL_RATE: 2.2,              // rad/s at full stick
  YAW_RATE: 0.5,               // rad/s direct yaw input
  BANK_TURN_FACTOR: 1.6,       // heading change per rad of bank per second (speed-scaled)
  PITCH_LIMIT: 1.34,           // ~77 deg — clamp so a stall dives instead of spinning
  ROLL_LIMIT: 1.4,             // ~80 deg max bank
  MIN_SPEED: 8,                // m/s floor (arcade: never fully stops in the air)
});

function forward(attitude) {
  const cp = Math.cos(attitude.pitch), sp = Math.sin(attitude.pitch);
  const cy = Math.cos(attitude.yaw), sy = Math.sin(attitude.yaw);
  return { x: -sy * cp, y: sp, z: -cy * cp }; // pitch up => +y; yaw left (+) turns toward -x
}

// World-space unit nose direction for a given attitude (used by the renderer).
function noseDirection(attitude) { return forward(attitude); }

function createFlightState(spawn) {
  const fwd = forward({ pitch: 0, roll: 0, yaw: spawn.heading });
  const speed = 90;
  return {
    pos: clone(spawn.pos),
    vel: scale(fwd, speed),
    speed,
    attitude: { pitch: 0, roll: 0, yaw: spawn.heading },
    throttle: 0.6,
    stalled: false,
    stallTimer: 0,
  };
}

function step(state, inputSnapshot, dt) {
  const C = FLIGHT_CONST;
  if (dt <= 0) return state;

  // --- throttle ---
  const throttle = Math.min(1, Math.max(0,
    state.throttle + (inputSnapshot.throttleDelta || 0) * C.MAX_THROTTLE_RATE * dt));

  // --- attitude rates ---
  let pitchRate = (inputSnapshot.pitch || 0) * C.PITCH_RATE;
  let rollRate = (inputSnapshot.roll || 0) * C.ROLL_RATE;
  const yawInput = (inputSnapshot.yaw || 0) * C.YAW_RATE;

  if (state.stalled) {
    pitchRate -= 1.4;   // forced nose-down while stalled
    rollRate *= 0.35;   // weakened aileron authority
  }

  let pitch = state.attitude.pitch + pitchRate * dt;
  pitch = Math.max(-C.PITCH_LIMIT, Math.min(C.PITCH_LIMIT, pitch)); // no full rotations

  let roll = state.attitude.roll + rollRate * dt;
  if (!inputSnapshot.roll) roll *= Math.max(0, 1 - 2.5 * dt); // wings level when released
  roll = Math.max(-C.ROLL_LIMIT, Math.min(C.ROLL_LIMIT, roll));

  const speedFactor = Math.min(1, state.speed / 140);
  let yaw = state.attitude.yaw + (yawInput + roll * C.BANK_TURN_FACTOR * speedFactor) * dt;

  const attitude = { pitch, roll, yaw };
  const fwd = forward(attitude);

  // --- airspeed dynamics along the nose direction ---
  const thrustAccel = throttle * C.THRUST_ACCEL;
  const dragAccel = C.DRAG_COEFF * state.speed * state.speed;
  const gravityAlongNose = -C.GRAVITY * fwd.y; // climbing (fwd.y>0) bleeds speed, diving gains it
  let speed = state.speed + (thrustAccel - dragAccel + gravityAlongNose) * dt;
  speed = Math.max(C.MIN_SPEED, speed);

  const vel = scale(fwd, speed);
  const pos = add(state.pos, scale(vel, dt));

  // --- stall state machine with hysteresis ---
  let stalled = state.stalled;
  if (!stalled && speed < C.STALL_SPEED) {
    stalled = true;
  } else if (stalled && speed > C.STALL_RECOVERY_SPEED) {
    stalled = false;
  }

  return {
    pos, vel, speed, attitude, throttle, stalled,
    stallTimer: stalled ? state.stallTimer + dt : 0,
  };
}

return {FLIGHT_CONST, forward, noseDirection, createFlightState, step};
})();

/* ===== core/worldGen.js (M_worldGen) ===== */
const M_worldGen = (() => {
const {add, scale} = M_vec3;
// core/worldGen.js — deterministic world generation: terrain heightfield + ordered gate chain.
// Same seed always produces an identical world (deep-equal). No unseeded randomness.


// --- seeded PRNG (mulberry32) ---
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- deterministic value noise on a periodic (toroidal) grid: bilinear + smoothstep ---
// Periodic in both axes, so fbm's modulo-wrapped octaves stay continuous everywhere.
function makeNoise(rng, gridSize = 24) {
  const grid = new Float32Array(gridSize * gridSize);
  for (let i = 0; i < grid.length; i++) grid[i] = rng();
  function smooth(t) { return t * t * (3 - 2 * t); }
  // sample at normalized coords u,v in [0,1] -> [0,1]; wraps periodically
  function sample(u, v) {
    u = ((u % 1) + 1) % 1;
    v = ((v % 1) + 1) % 1;
    const gu = u * gridSize, gv = v * gridSize;
    const x0 = Math.floor(gu), y0 = Math.floor(gv);
    const fx = smooth(gu - x0), fy = smooth(gv - y0);
    const a = grid[(y0 % gridSize) * gridSize + (x0 % gridSize)];
    const b = grid[(y0 % gridSize) * gridSize + ((x0 + 1) % gridSize)];
    const c = grid[((y0 + 1) % gridSize) * gridSize + (x0 % gridSize)];
    const d = grid[((y0 + 1) % gridSize) * gridSize + ((x0 + 1) % gridSize)];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  // fractal brownian motion: octaves of the same grid at increasing frequency.
  // freq growth kept gentle (1.6x) so high-frequency detail stays low-amplitude and
  // slopes remain flyable rather than cliff-like.
  function fbm(u, v, octaves = 3) {
    let val = 0, amp = 1, freq = 1, sum = 0;
    for (let o = 0; o < octaves; o++) {
      // deterministic per-octave offset so octaves differ without extra rng state
      const ou = ((u * freq + o * 0.37) % 1 + 1) % 1;
      const ov = ((v * freq + o * 0.61) % 1 + 1) % 1;
      val += sample(ou, ov) * amp;
      sum += amp;
      amp *= 0.5; freq *= 1.6;
    }
    return val / sum; // [0,1]
  }
  return { fbm };
}

const WORLD_CONST = Object.freeze({
  SIZE: 4000,            // world extent in meters (centered on origin)
  MOUNTAIN_HEIGHT: 320,  // max terrain elevation
  WATER_LEVEL: -18,      // below this is water
  GATE_COUNT: 12,        // gates in a Gate Run
  GATE_RADIUS: 45,       // meters
  MIN_GATE_CLEARANCE: 50,// required clearance above terrain (meters)
});

function generateWorld(seed) {
  const rng = mulberry32(Math.floor(seed));
  const noise = makeNoise(rng);
  const { SIZE, MOUNTAIN_HEIGHT } = WORLD_CONST;
  const half = SIZE / 2;

  // terrain: ridged-ish mountains with a flatter corridor near the spawn axis
  function heightAt(x, z) {
    const u = (x + half) / SIZE, v = (z + half) / SIZE;
    let h = noise.fbm(u, v, 3);
    // sharpen peaks mildly: push distribution toward extremes without steepening slopes too much
    h = Math.pow(h, 1.35);
    let elev = -30 + h * MOUNTAIN_HEIGHT;
    // flatten a corridor along the gate path (z axis) so runs are flyable
    const corridor = Math.exp(-(x * x) / (2 * 500 * 500));
    elev *= (1 - 0.75 * corridor);
    return elev;
  }

  // --- gates: ordered chain snaking across the world ---
  const gates = [];
  const n = WORLD_CONST.GATE_COUNT;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const z = -half + 400 + t * (SIZE - 800);           // spread along z with margins
    const x = Math.sin(t * Math.PI * 2.5) * 900;        // snake across x
    let y = heightAt(x, z) + WORLD_CONST.MIN_GATE_CLEARANCE + 60 + rng() * 120;
    gates.push({ pos: { x, y, z }, radius: WORLD_CONST.GATE_RADIUS });
  }

  const spawnPos = { x: 0, y: heightAt(0, -half + 300) + 80, z: -half + 300 };

  return {
    seed: Math.floor(seed),
    size: SIZE,
    waterLevel: WORLD_CONST.WATER_LEVEL,
    heightAt,
    gates,
    // gates lie toward +z from spawn; flightModel forward(yaw=PI) points +z
    spawn: { pos: spawnPos, heading: Math.PI },
    bounds: { size: SIZE },
  };
}

return {WORLD_CONST, generateWorld};
})();

/* ===== core/gameLogic.js (M_gameLogic) ===== */
const M_gameLogic = (() => {
const {sub, length} = M_vec3;
// core/gameLogic.js — game state machine, scoring, mode rules. Emits plain events; never renders.
// Contract: createGame(mode, world) attaches the world to the game object so update() can
// check gates and terrain without extra parameters.


const GAME_CONST = Object.freeze({
  GATE_BASE_SCORE: 100,        // per gate passed
  NEAR_MISS_SCORE: 25,         // within 2x radius but not through (once per gate)
  SPEED_BONUS_MAX: 50,         // added when passing a gate above speed threshold
  SPEED_BONUS_THRESHOLD: 160,  // m/s
});

function createGame(mode, world) {
  if (mode !== 'gateRun' && mode !== 'freeFlight') throw new Error('unknown mode: ' + mode);
  return {
    mode,
    phase: 'ready',            // ready | flying | complete | crashed
    score: 0,
    time: 0,                   // seconds of flight
    nextGate: 0,               // index into world.gates (gateRun only)
    gateResults: [],           // per-gate: {passed, nearMiss}
    world,                     // attached for terrain/gate checks in update()
    stalledWasReported: false, // internal edge-trigger state
  };
}

function distance(a, b) { return length(sub(a, b)); }

function update(game, flightState, dt) {
  if (dt <= 0) return { game, events: [] };
  const events = [];
  const g = Object.assign({}, game, { gateResults: game.gateResults.slice() });

  // terminal states: no further updates
  if (g.phase === 'complete' || g.phase === 'crashed') return { game: g, events };

  if (g.phase === 'ready') g.phase = 'flying';
  g.time += dt;

  const gates = g.mode === 'gateRun' && g.world ? g.world.gates : [];

  // --- gate chain (in-order only) ---
  while (g.nextGate < gates.length) {
    const gate = gates[g.nextGate];
    const d = distance(flightState.pos, gate.pos);
    if (d <= gate.radius) {
      let pts = GAME_CONST.GATE_BASE_SCORE;
      if (flightState.speed >= GAME_CONST.SPEED_BONUS_THRESHOLD) pts += GAME_CONST.SPEED_BONUS_MAX;
      g.score += pts;
      g.gateResults[g.nextGate] = { passed: true, nearMiss: false };
      events.push({ type: 'gatePassed', index: g.nextGate });
      events.push({ type: 'scoreChanged', value: g.score });
      g.nextGate++;
    } else if (d <= gate.radius * 2) {
      // beside the current gate: award near-miss once, then hold position in the chain
      const rec = g.gateResults[g.nextGate];
      if (!rec || !rec.nearMissAwarded) {
        g.score += GAME_CONST.NEAR_MISS_SCORE;
        g.gateResults[g.nextGate] = Object.assign({ passed: false, nearMiss: true }, rec || {}, { nearMissAwarded: true });
        events.push({ type: 'nearMiss', index: g.nextGate });
        events.push({ type: 'scoreChanged', value: g.score });
      }
      break;
    } else {
      break; // far from current gate — nothing to do this step
    }
  }

  if (g.mode === 'gateRun' && gates.length > 0 && g.nextGate >= gates.length) {
    g.phase = 'complete';
    events.push({ type: 'runComplete', score: g.score, time: g.time });
  }

  // --- stall event (edge-triggered) ---
  if (flightState.stalled && !g.stalledWasReported) {
    events.push({ type: 'stalled' });
    g.stalledWasReported = true;
  } else if (!flightState.stalled) {
    g.stalledWasReported = false;
  }

  // --- crash checks (world attached) ---
  if (g.world) {
    const terrainY = g.world.heightAt(flightState.pos.x, flightState.pos.z);
    if (flightState.pos.y <= terrainY) {
      g.phase = 'crashed';
      events.push({ type: 'crash', reason: 'terrain' });
    } else if (flightState.pos.y < g.world.waterLevel) {
      g.phase = 'crashed';
      events.push({ type: 'crash', reason: 'water' });
    }
  }

  return { game: g, events };
}

return {GAME_CONST, createGame, update};
})();

/* ===== ui/hud.js (M_hud) ===== */
const M_hud = (() => {

// ui/hud.js — DOM overlay. Reads plain snapshot objects only; never imports core/render.
// Contract: createHud(containerEl) -> Hud { update(snapshot), showBanner(text), hideBanner(), dispose() }
// Snapshot = { speed, alt, headingDeg, throttle, score, time, mode, phase, nextGate, gateCount, stalled }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = 'sw-' + cls;
  if (text != null) e.textContent = text;
  return e;
}

function createHud(containerEl) {
  const root = el('div', 'hud');
  containerEl.appendChild(root);

  // top-left: flight data readout
  const dataBox = el('div', 'data');
  const speedRow = row('SPD', 'speed');
  const altRow = row('ALT', 'alt');
  const hdgRow = row('HDG', 'hdg');
  const thrRow = row('THR', 'thr');
  dataBox.append(speedRow, altRow, hdgRow, thrRow);
  root.appendChild(dataBox);

  // top-right: score / time / mode
  const statusBox = el('div', 'status');
  const modeEl = el('div', 'mode', '');
  const scoreEl = el('div', 'score', 'SCORE 0');
  const timeEl = el('div', 'time', 'TIME 0.0s');
  statusBox.append(modeEl, scoreEl, timeEl);
  root.appendChild(statusBox);

  // center banner (gate passed / stall warning / crash / complete)
  const banner = el('div', 'banner');
  root.appendChild(banner);

  // bottom hint bar
  const hints = el('div', 'hints',
    'W/S pitch · A/D roll · Q/E yaw · Shift/Ctrl throttle · C camera · R restart');
  root.appendChild(hints);

  function row(label, key) {
    const r = el('div', 'row');
    r.append(el('span', 'label', label), el('span', 'value sw-' + key, ''));
    return r;
  }
  const speedVal = dataBox.querySelector('.sw-speed');
  const altVal = dataBox.querySelector('.sw-alt');
  const hdgVal = dataBox.querySelector('.sw-hdg');
  const thrVal = dataBox.querySelector('.sw-thr');

  let bannerTimer = null;

  function update(s) {
    if (!s) return;
    speedVal.textContent = Math.round(s.speed || 0);
    altVal.textContent = Math.max(0, Math.round((s.alt || 0)));
    hdgVal.textContent = String(Math.round(((s.headingDeg % 360) + 360) % 360)).padStart(3, '0') + '°';
    const thrPct = Math.round((s.throttle || 0) * 100);
    thrVal.textContent = thrPct + '%';

    if (s.mode === 'gateRun' && s.phase !== 'complete' && s.phase !== 'crashed') {
      modeEl.textContent = 'GATE RUN · ' + Math.min(s.nextGate || 0, s.gateCount) + '/' + s.gateCount;
    } else if (s.mode === 'freeFlight') {
      modeEl.textContent = 'FREE FLIGHT';
    } else {
      modeEl.textContent = s.phase === 'complete' ? 'RUN COMPLETE' : s.phase === 'crashed' ? 'CRASHED' : '';
    }
    scoreEl.textContent = 'SCORE ' + (s.score || 0);
    timeEl.textContent = 'TIME ' + ((s.time || 0).toFixed(1)) + 's';

    // stall warning: pulse the data box red while stalled
    root.classList.toggle('stalled', !!s.stalled && s.phase === 'flying');
  }

  function showBanner(text, ms = 2200) {
    banner.textContent = text;
    banner.classList.add('show');
    if (bannerTimer) clearTimeout(bannerTimer);
    if (ms > 0) bannerTimer = setTimeout(() => banner.classList.remove('show'), ms);
  }

  function hideBanner() {
    if (bannerTimer) clearTimeout(bannerTimer);
    banner.classList.remove('show');
  }

  function dispose() {
    if (bannerTimer) clearTimeout(bannerTimer);
    root.remove();
  }

  return { update, showBanner, hideBanner, dispose };
}

return {createHud};
})();

/* ===== audio/engineSound.js (M_engineSound) ===== */
const M_engineSound = (() => {

// audio/engineSound.js — WebAudio synth for the jet engine. Takes numbers only; no DOM.
// Contract: createEngineAudio(context?) -> Audio { update(throttle, speed), dispose() }
// Autoplay-safe: starts silent until the context is running (resumed on first user gesture).

function createEngineAudio(audioContext) {
  const AC = audioContext || (typeof window !== 'undefined' && window.AudioContext);
  if (!AC) return { update() {}, unlock() {}, dispose() {} }; // no WebAudio: degrade to silence

  let ctx;
  try { ctx = new AC(); } catch (e) { return { update() {}, unlock() {}, dispose() {} }; }

  const master = ctx.createGain();
  master.gain.value = 0.0;
  master.connect(ctx.destination);

  // low rumble: sawtooth through a lowpass, plus a detuned sub-oscillator for body
  const osc1 = ctx.createOscillator();
  osc1.type = 'sawtooth';
  osc1.frequency.value = 60;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 420;
  lp.Q.value = 0.8;

  const osc2 = ctx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.value = 31;
  const g2 = ctx.createGain();
  g2.gain.value = 0.5;

  osc1.connect(lp); lp.connect(master);
  osc2.connect(g2); g2.connect(master);
  osc1.start(); osc2.start();

  let lastT = 0;
  // Called on a user gesture so the browser lets us start sound.
  function unlock() {
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }

  function update(throttle, speed) {
    if (ctx.state !== 'running') return; // silent until user gesture resumes it
    const t = ctx.currentTime;
    const thr = Math.max(0, Math.min(1, throttle || 0));
    const spd = Math.max(0, speed || 0);

    // pitch follows throttle (idle ~55Hz -> full ~170Hz), slight speed contribution
    const f = 52 + thr * 118 + Math.min(40, spd * 0.12);
    osc1.frequency.setTargetAtTime(f, t, 0.06);
    osc2.frequency.setTargetAtTime(f * 0.5, t, 0.06);
    lp.frequency.setTargetAtTime(300 + thr * 900, t, 0.08);

    // gain: quiet at idle, loud at full throttle; fade in/out smoothly
    const target = ctx.state === 'running' ? (0.05 + thr * 0.22) : 0.0;
    master.gain.setTargetAtTime(target, t, 0.1);

    // resume on first audible request after a user gesture
    if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
    lastT = t;
  }

  function dispose() {
    try { osc1.stop(); osc2.stop(); } catch (e) {}
    master.disconnect();
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 50);
  }

  return { update, unlock, dispose };
}

return {createEngineAudio};
})();

/* ===== render/threeAdapter.js (M_threeAdapter) ===== */
const M_threeAdapter = (() => {
const {cross, normalize, scale, add} = M_vec3;
const {noseDirection} = M_flightModel;
// render/threeAdapter.js — the ONLY module that imports three.js (via import map / CDN).
// Consumes a World + FlightState, owns the scene/camera/meshes. Emits nothing; just draws.

// Map a physics attitude to an orthonormal world-space body basis {R,U,F}.
// F (nose) reuses the exact physics forward() so visuals always match the sim.
// Roll is applied about the nose axis so banking is visible; pitch/yaw come from F.
function attitudeToBasis(attitude) {
  const F = normalize(noseDirection(attitude));          // world-space nose direction
  const up0 = { x: 0, y: 1, z: 0 };
  let R = cross(up0, F);                                  // right (perp to nose & world-up)
  if (R.x * R.x + R.y * R.y + R.z * R.z < 1e-8) R = { x: 1, y: 0, z: 0 }; // nose ~vertical fallback
  R = normalize(R);
  const U1 = cross(F, R);                                 // level up in the vertical plane of F
  const cr = Math.cos(attitude.roll), sr = Math.sin(attitude.roll);
  // positive roll = left bank (top tilts toward -R)
  const U = add(scale(U1, cr), scale(R, -sr));
  const Rr = add(scale(R, cr), scale(U1, sr));
  return { R: normalize(Rr), U: normalize(U), F };
}

function elevationColor(h, waterLevel) {
  // low-poly stylized bands by altitude
  if (h < waterLevel + 4) return [0.36, 0.52, 0.42];      // shallow sand/grass edge
  if (h < 40) return [0.30, 0.58, 0.30];                  // lowland green
  if (h < 110) return [0.24, 0.47, 0.26];                 // mid forest
  if (h < 190) return [0.45, 0.42, 0.34];                 // rock
  if (h < 250) return [0.58, 0.57, 0.56];                 // high rock
  return [0.93, 0.95, 0.98];                              // snow
}

function buildTerrain(world) {
  const size = world.size;
  const seg = 120;
  let geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);                              // flat on ground: spans X/Z, normal +Y
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, world.heightAt(x, z));
  }
  geo.computeVertexNormals();
  // non-indexed => per-face normals => faceted low-poly look
  geo = geo.toNonIndexed();
  geo.computeVertexNormals();
  const p2 = geo.attributes.position;
  const colors = new Float32Array(p2.count * 3);
  for (let i = 0; i < p2.count; i++) {
    const c = elevationColor(p2.getY(i), world.waterLevel);
    colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  return new THREE.Mesh(geo, mat);
}

function buildJet() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8dde6, metalness: 0.35, roughness: 0.5, flatShading: true });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xe2483d, metalness: 0.3, roughness: 0.5, flatShading: true });

  // fuselage: nose toward +Z (local forward)
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.7, 9, 8), bodyMat);
  fus.rotation.x = Math.PI / 2;                            // cylinder axis Y -> Z
  g.add(fus);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3.2, 8), accentMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 6.1;
  g.add(nose);

  // main wings (swept boxes)
  const wingGeo = new THREE.BoxGeometry(14, 0.5, 3.4);
  const wingL = new THREE.Mesh(wingGeo, bodyMat); wingL.position.set(-6.2, 0.2, -0.5); wingL.rotation.y = 0.28;
  const wingR = new THREE.Mesh(wingGeo, bodyMat); wingR.position.set(6.2, 0.2, -0.5); wingR.rotation.y = -0.28;
  g.add(wingL, wingR);

  // tail wings + vertical stabilizer
  const tailGeo = new THREE.BoxGeometry(6, 0.4, 1.8);
  const tailL = new THREE.Mesh(tailGeo, accentMat); tailL.position.set(-2.6, 0.3, -4.2);
  const tailR = new THREE.Mesh(tailGeo, accentMat); tailR.position.set(2.6, 0.3, -4.2);
  g.add(tailL, tailR);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 2.2), accentMat);
  fin.position.set(0, 1.8, -4.6);
  g.add(fin);

  // cockpit canopy
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x2b3a55, metalness: 0.6, roughness: 0.2 }));
  canopy.scale.set(1, 0.7, 1.6);
  canopy.position.set(0, 1.0, 1.5);
  g.add(canopy);

  g.scale.setScalar(1.4);
  return g;
}

function createRenderer(canvas, world, opts = {}) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: !!opts.preserveDrawingBuffer });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const skyColor = new THREE.Color(0x9fd3ff);
  scene.background = skyColor;
  scene.fog = new THREE.Fog(skyColor.getHex(), 600, 2600);

  const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 8000);
  camera.position.set(0, world.spawn.pos.y + 30, world.spawn.pos.z - 40);

  // lighting: sky/ground hemisphere + a sun
  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x5a6b4f, 1.0);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
  sun.position.set(-800, 1200, -600);
  scene.add(sun);

  // terrain + water
  scene.add(buildTerrain(world));
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(world.size * 3, world.size * 3),
    new THREE.MeshLambertMaterial({ color: 0x2f6fb0, transparent: true, opacity: 0.85 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = world.waterLevel;
  scene.add(water);

  // gates: vertical rings oriented along the local path direction
  const gateGroup = new THREE.Group();
  const gateMeshes = [];
  const ringGeo = new THREE.TorusGeometry(1, 0.6, 8, 24);
  for (let i = 0; i < world.gates.length; i++) {
    const g = world.gates[i];
    const prev = i === 0 ? world.spawn.pos : world.gates[i - 1].pos;
    let dir = { x: g.pos.x - prev.x, y: g.pos.y - prev.y, z: g.pos.z - prev.z };
    const dl = Math.sqrt(dir.x * dir.x + dir.y * dir.y + dir.z * dir.z) || 1;
    dir = scale(dir, 1 / dl);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x224466, flatShading: true });
    const m = new THREE.Mesh(ringGeo, mat);
    m.position.set(g.pos.x, g.pos.y, g.pos.z);
    m.scale.setScalar(g.radius);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(dir.x, dir.y, dir.z));
    gateGroup.add(m);
    gateMeshes.push(m);
  }
  scene.add(gateGroup);

  const jet = buildJet();
  scene.add(jet);

  let cameraMode = 'chase';
  const _m4 = new THREE.Matrix4();
  const _vR = new THREE.Vector3(), _vU = new THREE.Vector3(), _vF = new THREE.Vector3();
  const _camPos = new THREE.Vector3(), _lookAt = new THREE.Vector3();

  function resize() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener('resize', resize);
  }

  function update(flightState, gameSnapshot) {
    const p = flightState.pos;
    jet.position.set(p.x, p.y, p.z);
    const b = attitudeToBasis(flightState.attitude);
    _vR.set(b.R.x, b.R.y, b.R.z);
    _vU.set(b.U.x, b.U.y, b.U.z);
    _vF.set(b.F.x, b.F.y, b.F.z);
    _m4.makeBasis(_vR, _vU, _vF);
    jet.quaternion.setFromRotationMatrix(_m4);

    // gate highlight: next = bright amber, passed = green, future = dim
    const nextGate = gameSnapshot && typeof gameSnapshot.nextGate === 'number' ? gameSnapshot.nextGate : -1;
    for (let i = 0; i < gateMeshes.length; i++) {
      const mat = gateMeshes[i].material;
      if (i < nextGate) { mat.color.setHex(0x39d98a); mat.emissive.setHex(0x0a3a24); }
      else if (i === nextGate) { mat.color.setHex(0xffc23d); mat.emissive.setHex(0x6b4a05); }
      else { mat.color.setHex(0xb9c2cc); mat.emissive.setHex(0x101820); }
    }

    // camera
    if (cameraMode === 'cockpit') {
      _camPos.set(p.x + b.U.x * 1.5, p.y + b.U.y * 1.5, p.z + b.U.z * 1.5)
        .addScaledVector(_vF, -0.5);
      camera.position.copy(_camPos);
      _lookAt.set(p.x + b.F.x * 50, p.y + b.F.y * 50, p.z + b.F.z * 50);
      camera.up.set(b.U.x, b.U.y, b.U.z);
      camera.lookAt(_lookAt);
    } else { // chase
      const dist = 26, height = 9;
      _camPos.set(p.x - b.F.x * dist, p.y + height, p.z - b.F.z * dist);
      camera.position.lerp(_camPos, 0.15);                 // smooth follow
      _lookAt.set(p.x + b.F.x * 20, p.y + b.F.y * 20, p.z + b.F.z * 20);
      camera.up.set(0, 1, 0);
      camera.lookAt(_lookAt);
    }

    renderer.render(scene, camera);
  }

  function setCameraMode(mode) { if (mode === 'chase' || mode === 'cockpit') cameraMode = mode; }

  function dispose() {
    renderer.dispose();
    scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  }

  return { update, setCameraMode, dispose };
}

return {createRenderer};
})();

/* ===== main.js (M_main) ===== */
const M_main = (() => {
const {createInput} = M_input;
const {createFlightState, step: flightStep} = M_flightModel;
const {generateWorld} = M_worldGen;
const {createGame, update: gameUpdate} = M_gameLogic;
const {createRenderer} = M_threeAdapter;
const {createHud} = M_hud;
const {createEngineAudio} = M_engineSound;
// main.js — composition root. The ONLY place that imports all modules and knows they exist.
// Owns the rAF loop, a fixed 60Hz logic timestep (accumulator), and wires:
//   keyboard events -> InputState -> FlightModel.step -> GameLogic.update -> Renderer / Hud / Audio


const STEP = 1 / 60;          // fixed logic timestep (seconds)
const MAX_FRAME_DT = 0.25;    // clamp long frames (tab switch) to avoid spiral of death
const BEST_KEY = 'skyward.bestTime.gateRun';

function headingDeg(yaw) {
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);   // horizontal nose direction
  return ((Math.atan2(fx, fz) * 180 / Math.PI) % 360 + 360) % 360;
}

function boot({ canvas, container }) {
  const world = generateWorld(31337);               // fixed seed: a known-good flyable layout
  const input = createInput();
  let renderer, hud, audio;
  const preserve = typeof location !== 'undefined' && /[?&]debug\b/.test(location.search);
  try {
    renderer = createRenderer(canvas, world, { preserveDrawingBuffer: preserve });
  } catch (e) {
    container.textContent = 'WebGL is not available in this browser.';
    throw e;
  }
  hud = createHud(container);
  audio = createEngineAudio();

  let mode = null;
  let game = null;
  let flightState = null;
  const idleFlight = createFlightState(world.spawn); // shown parked at spawn while in menu
  let cameraMode = 'chase';
  let bestTime = Number(localStorage.getItem(BEST_KEY)) || 0;

  // ---------- menu overlay (main.js is allowed to touch the DOM) ----------
  const menu = document.createElement('div');
  menu.className = 'sw-menu';
  menu.innerHTML = `
    <h1>SKYWARD</h1>
    <p class="sub">low-poly arcade flight · ${world.gates.length} gates over the mountains</p>
    <button data-mode="gateRun">GATE RUN</button>
    <button data-mode="freeFlight">FREE FLIGHT</button>
    <p class="best" id="sw-best"></p>`;
  container.appendChild(menu);

  function refreshBest() {
    const b = menu.querySelector('#sw-best');
    b.textContent = bestTime > 0 ? `best run: ${bestTime.toFixed(1)}s` : 'no completed runs yet';
  }
  refreshBest();

  function showMenu(show) {
    menu.style.display = show ? '' : 'none';
    if (show && game) hud.hideBanner();
  }

  function startGame(m) {
    mode = m;
    game = createGame(mode, world);
    flightState = createFlightState(world.spawn);
    cameraMode = 'chase';
    renderer.setCameraMode(cameraMode);
    showMenu(false);
    hud.showBanner(mode === 'gateRun' ? 'GATE RUN — fly through every ring' : 'FREE FLIGHT — enjoy the sky', 2600);
  }

  function restart() {
    if (!mode) return;
    startGame(mode);
  }

  menu.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => { audio.unlock(); startGame(btn.dataset.mode); });
  });

  // ---------- keyboard: feed the pure input state machine + UI keys ----------
  const UI_KEYS = new Set(['KeyC', 'KeyR', 'KeyM']);
  window.addEventListener('keydown', (e) => {
    if (UI_KEYS.has(e.code)) return;               // handled below, not flight input
    e.preventDefault();                            // stop page scroll on arrows/space etc.
    audio.unlock();
    input.update([{ type: 'down', code: e.code }]);
  });
  window.addEventListener('keyup', (e) => {
    if (UI_KEYS.has(e.code)) return;
    input.update([{ type: 'up', code: e.code }]);
  });

  function onUiKey(code) {
    audio.unlock();
    if (code === 'KeyC' && mode) {
      cameraMode = cameraMode === 'chase' ? 'cockpit' : 'chase';
      renderer.setCameraMode(cameraMode);
      hud.showBanner('CAMERA: ' + cameraMode.toUpperCase(), 900);
    } else if (code === 'KeyR') {
      restart();
    } else if (code === 'KeyM') {
      showMenu(true);
    }
  }
  window.addEventListener('keydown', (e) => { if (UI_KEYS.has(e.code)) onUiKey(e.code); });

  // ---------- game events -> presentation ----------
  function handleEvents(events) {
    for (const ev of events) {
      switch (ev.type) {
        case 'gatePassed':
          hud.showBanner(`GATE ${ev.index + 1}/${world.gates.length}`, 900);
          break;
        case 'nearMiss':
          hud.showBanner('NEAR MISS +25', 800);
          break;
        case 'stalled':
          hud.showBanner('STALL — nose down, full throttle!', 1600);
          break;
        case 'runComplete': {
          const isBest = bestTime === 0 || ev.time < bestTime;
          if (isBest) { bestTime = ev.time; localStorage.setItem(BEST_KEY, String(ev.time)); }
          hud.showBanner(`RUN COMPLETE — ${ev.score} pts in ${ev.time.toFixed(1)}s${isBest ? ' · NEW BEST!' : ''}`, 6000);
          break;
        }
        case 'crash':
          hud.showBanner('CRASHED (' + ev.reason + ') — press R to retry', 8000);
          break;
      }
    }
  }

  // ---------- main loop: fixed-timestep logic, per-frame render ----------
  let last = performance.now();
  let acc = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(MAX_FRAME_DT, (now - last) / 1000);
    last = now;

    if (mode && game && flightState) {
      acc += dt;
      while (acc >= STEP) {
        acc -= STEP;
        const snap = input.snapshot();
        flightState = flightStep(flightState, snap, STEP);
        const res = gameUpdate(game, flightState, STEP);
        game = res.game;
        handleEvents(res.events);
      }

      // HUD snapshot (plain numbers only)
      hud.update({
        speed: flightState.speed,
        alt: Math.max(0, flightState.pos.y - world.heightAt(flightState.pos.x, flightState.pos.z)),
        headingDeg: headingDeg(flightState.attitude.yaw),
        throttle: flightState.throttle,
        score: game.score,
        time: game.time,
        mode: game.mode,
        phase: game.phase,
        nextGate: game.nextGate,
        gateCount: world.gates.length,
        stalled: flightState.stalled,
      });

      audio.update(flightState.throttle, flightState.speed);
    } else {
      acc = 0; // idle at menu: no logic steps
    }

    renderer.update(
      flightState || idleFlight,
      game ? { nextGate: game.nextGate } : null
    );
  }
  requestAnimationFrame(frame);

  // minimal read-only debug/test hook (browser only)
  if (typeof window !== 'undefined') {
    window.__skyward = {
      get flightState() { return flightState; },
      get game() { return game; },
      startGame,
    };
  }

  return { dispose() { audio.dispose(); hud.dispose(); renderer.dispose(); } };
}

// auto-boot when running in a browser with the expected DOM ids
if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  const canvas = document.getElementById('skyward-canvas');
  const container = document.getElementById('skyward-ui');
  if (canvas && container) boot({ canvas, container });
}

return {boot};
})();

</script>
